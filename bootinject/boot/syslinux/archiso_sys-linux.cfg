LABEL arch64
TEXT HELP
Boot Omarchy Lite - tuned for old 2-core CPUs and under 2 GB of RAM.
It allows you to install Omarchy or perform system maintenance.
ENDTEXT
MENU LABEL Omarchy Lite - low RAM / old CPU (x86_64, BIOS)
LINUX /arch/boot/x86_64/vmlinuz-linux-omarchy
INITRD /arch/boot/x86_64/initramfs-linux-omarchy.img
APPEND archisobasedir=arch archisosearchuuid=2026-11-05-04-48-49-00 copytoram=n initramfs_options=size=90% initramfs_async=0 xe.enable_panel_replay=0 mitigations=off intel_idle.states_off=0x3fc

LABEL arch64safe
TEXT HELP
Boot Omarchy Lite with forced software rendering (llvmpipe) for GPUs that
cannot start Hyprland. Choose this only for recovery; it is slow.
ENDTEXT
MENU LABEL Omarchy Lite - Safe Graphics Mode (software rendering, BIOS)
LINUX /arch/boot/x86_64/vmlinuz-linux-omarchy
INITRD /arch/boot/x86_64/initramfs-linux-omarchy.img
APPEND archisobasedir=arch archisosearchuuid=2026-11-05-04-48-49-00 copytoram=n initramfs_options=size=90% initramfs_async=0 mitigations=off systemd.setenv=LIBGL_ALWAYS_SOFTWARE=1 systemd.setenv=GALLIUM_DRIVER=llvmpipe systemd.setenv=MESA_GLES_VERSION_OVERRIDE=3.0 systemd.setenv=MESA_GL_VERSION_OVERRIDE=3.00

LABEL arch64stock
TEXT HELP
Boot the original Omarchy install medium on BIOS (unmodified settings).
ENDTEXT
MENU LABEL Omarchy - stock settings (x86_64, BIOS)
LINUX /arch/boot/x86_64/vmlinuz-linux-omarchy
INITRD /arch/boot/x86_64/initramfs-linux-omarchy.img
APPEND archisobasedir=arch archisosearchuuid=2026-11-05-04-48-49-00 copytoram=n initramfs_options=size=90% quiet splash xe.enable_panel_replay=0 initramfs_async=0

# Accessibility boot option
LABEL arch64speech
TEXT HELP
Boot the Omarchy install medium on BIOS with speakup screen reader.
It allows you to install Omarchy or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Omarchy install medium (x86_64, BIOS) with ^speech
LINUX /arch/boot/x86_64/vmlinuz-linux-omarchy
INITRD /arch/boot/x86_64/initramfs-linux-omarchy.img
APPEND archisobasedir=arch archisosearchuuid=2026-11-05-04-48-49-00 copytoram=n initramfs_options=size=90% accessibility=on xe.enable_panel_replay=0 initramfs_async=0 mitigations=off
